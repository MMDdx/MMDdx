name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: MMDdx
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: true
